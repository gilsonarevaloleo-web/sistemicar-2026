# SISTEMICAR — Netlify (frontend estático + API serverless)

[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  # Vite 7 exige Node 20.19+ o 22.12+. Node 20 llegó a EOL en abril 2026.
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  # Instalar devDependencies (vite, tsx) necesarias para npm run build
  NPM_CONFIG_PRODUCTION = "false"
  # VITE_* se incrustan en el JS del cliente a propósito (Firebase público + Gemini del radar).
  # Si Netlify las marca como secret, el escaneo aborta la fase Building.
  SECRETS_SCAN_OMIT_KEYS = "VITE_GEMINI_API_KEY,VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_DEV_SERVER_PORT"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,dist/netlify-api.cjs,dist/index.cjs"

[functions]
  node_bundler = "esbuild"

[functions.api]
  included_files = ["dist/netlify-api.cjs"]

# API Express → función serverless
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Clips GPS — no reescribir a index.html si el archivo existe
[[redirects]]
  from = "/voice/*"
  to = "/voice/:splat"
  status = 200

# SPA (wouter)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
