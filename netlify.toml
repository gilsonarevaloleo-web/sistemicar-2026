# SISTEMICAR — Netlify (frontend estático + API serverless)

[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Instalar devDependencies (vite, tsx) necesarias para npm run build
  NPM_CONFIG_PRODUCTION = "false"
  # Deploy previews fallaban ~30s sin log (deploy_time null). Desactivar escaneo
  # que aborta Building cuando VITE_* quedan embebidas en el cliente.
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler = "esbuild"
  # Solo handlers. Los *.test.ts viven fuera de este directorio
  # (Netlify empaqueta cada .ts de functions/ como Lambda).
  # Runtime: GEMINI_API_KEY se lee de process.env (Site settings).
  # collectGeminiApiKeys() la toma primero; no hace falta VITE_GEMINI_API_KEY.

[functions.api]
  included_files = ["dist/netlify-api.cjs"]

# Depósito V2 — evaluación perceptiva (función dedicada)
[[redirects]]
  from = "/api/deposito/evaluar"
  to = "/.netlify/functions/evaluar-deposito"
  status = 200
  force = true

# API Express → función serverless
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Clips GPS — no reescribir a index.html si el archivo existe
[[redirects]]
  from = "/voice/*"
  to = "/voice/:splat"
  status = 200

# SPA (wouter)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
